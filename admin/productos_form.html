    <script>
    /**
     * Validaciones JavaScript del formulario
     * Basado en: IACC - S6_NOTAS_PROFUNDIZACION_PROHT2305_DES.pdf
     */
    function validarFormularioProducto() {
        let nombre = document.getElementById('nombre').value.trim();
        let descripcion = document.getElementById('descripcion').value.trim();
        let precio = document.getElementById('precio').value;
        let stock = document.getElementById('stock').value;
        let categoria = document.getElementById('categoria').value.trim();
        let imagen = document.getElementById('imagen').value.trim();

        // Validar nombre
        if (nombre === '' || nombre.length < 3) {
            alert('El nombre del producto debe tener al menos 3 caracteres');
            document.getElementById('nombre').focus();
            return false;
        }

        // Validar descripción
        if (descripcion === '') {
            alert('La descripción es obligatoria');
            document.getElementById('descripcion').focus();
            return false;
        }

        // Validar precio
        if (precio === '' || isNaN(precio) || parseFloat(precio) <= 0) {
            alert('El precio debe ser un número mayor a 0');
            document.getElementById('precio').focus();
            return false;
        }

        // Validar stock
        if (stock === '' || isNaN(stock) || parseInt(stock) < 0) {
            alert('El stock debe ser un número entero no negativo');
            document.getElementById('stock').focus();
            return false;
        }

        // Validar categoría
        if (categoria === '') {
            alert('La categoría es obligatoria');
            document.getElementById('categoria').focus();
            return false;
        }

        // Validar URL de imagen (opcional pero recomendado)
        if (imagen !== '' && !isValidURL(imagen)) {
            alert('La URL de la imagen no es válida');
            document.getElementById('imagen').focus();
            return false;
        }

        return true;
    }

    // Función auxiliar para validar URL
    function isValidURL(string) {
        try {
            new URL(string);
            return true;
        } catch (_) {
            return false;
        }
    }

    // Validación en tiempo real del precio
    document.addEventListener('DOMContentLoaded', function() {
        let precioInput = document.getElementById('precio');
        precioInput.addEventListener('input', function() {
            let valor = parseFloat(this.value);
            if (isNaN(valor) || valor <= 0) {
                this.setCustomValidity('Ingrese un precio válido mayor a 0');
            } else {
                this.setCustomValidity('');
            }
        });
    });
    </script>
</head>
