    <script>
    /**
     * Validaciones JavaScript para formulario de clientes
     */
    function validarFormularioCliente() {
        let nombre = document.getElementById('nombre').value.trim();
        let email = document.getElementById('email').value.trim();
        let direccion = document.getElementById('direccion').value.trim();
        let telefono = document.getElementById('telefono').value.trim();

        // Validar nombre
        if (nombre === '' || nombre.length < 5) {
            alert('El nombre completo debe tener al menos 5 caracteres');
            document.getElementById('nombre').focus();
            return false;
        }

        // Validar email con expresión regular
        let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (email === '' || !emailRegex.test(email)) {
            alert('Ingrese un correo electrónico válido');
            document.getElementById('email').focus();
            return false;
        }

        // Validar dirección
        if (direccion === '') {
            alert('La dirección es obligatoria');
            document.getElementById('direccion').focus();
            return false;
        }

        // Validar teléfono (formato internacional básico)
        let telefonoRegex = /^[\+]?[(]?[0-9]{1,4}[)]?[-\s\./0-9]{7,}$/;
        if (telefono !== '' && !telefonoRegex.test(telefono)) {
            alert('Ingrese un número de teléfono válido');
            document.getElementById('telefono').focus();
            return false;
        }

        return true;
    }

    // Validación en tiempo real del email
    document.addEventListener('DOMContentLoaded', function() {
        let emailInput = document.getElementById('email');
        emailInput.addEventListener('blur', function() {
            let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(this.value)) {
                this.setCustomValidity('Ingrese un email válido (ejemplo@correo.com)');
            } else {
                this.setCustomValidity('');
            }
        });
    });
    </script>
</head>
